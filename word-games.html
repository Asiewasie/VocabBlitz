<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Piazzolla:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
    font-family: "Helvetica Neue", Arial, sans-serif;
    padding: 1.25rem;
  }

  #game-tabs {
    display: flex;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .tab-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    background: #FBEEE6;
    border: 3px solid #ECD3C4;
    border-radius: 18px;
    padding: 0.6rem 1rem;
    cursor: pointer;
    font-family: "Mochiy Pop One", sans-serif;
    font-size: 0.95rem;
    color: #1F2933;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    width: 120px;
  }

  .tab-btn img {
    height: 70px;
    object-fit: contain;
  }

  .tab-btn:hover { background: #F5DCC9; }
  .tab-btn:active { transform: scale(0.97); }

  .tab-btn.active {
    background: #C17854;
    border-color: #8F4E32;
    color: #ffffff;
  }

  .tab-btn:focus-visible {
    outline: 3px solid #8F4E32;
    outline-offset: 2px;
  }

  #game-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    max-width: 560px;
    width: 100%;
    background: #FFF9F5;
    border-radius: 20px;
    border: 2px solid #ECD3C4;
    padding: 1.75rem 1.5rem;
  }

  .game-title {
    font-family: "Mochiy Pop One", sans-serif;
    font-size: 1.6rem;
    color: #8F4E32;
    margin: 0;
    text-align: center;
  }

  .game-instructions {
    font-family: "Piazzolla", serif;
    font-size: 1.05rem;
    color: #4A4038;
    text-align: center;
    margin: 0;
    max-width: 420px;
  }

  .theme-display {
    font-family: "Mochiy Pop One", sans-serif;
    font-size: 2rem;
    color: #1F2933;
    text-align: center;
    min-height: 2.5rem;
  }

  .fuse-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 6rem;
  }

  .bomb {
    font-size: 4.5rem;
    display: inline-block;
    transition: transform 0.12s ease;
  }

  .bomb.pulse {
    transform: scale(1.18);
  }

  .bomb.exploding {
    animation: explode 0.6s ease forwards;
  }

  @keyframes explode {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.7); }
    100% { transform: scale(2.4); opacity: 0; }
  }

  .round-status {
    font-family: "Piazzolla", serif;
    font-size: 1rem;
    color: #4A4038;
    text-align: center;
    min-height: 1.4rem;
  }

  .action-btn {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
    font-size: 1rem;
    color: #ffffff;
    background: #4C9A2A;
    border: none;
    border-radius: 999px;
    padding: 0.8rem 2rem;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }

  .action-btn:hover { background: #3F8321; }
  .action-btn:active { transform: scale(0.96); }
  .action-btn:disabled { background: #B7C9AC; cursor: default; }

  .action-btn.secondary { background: #C17854; }
  .action-btn.secondary:hover { background: #A9603F; }

  .bet-input-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: "Piazzolla", serif;
    font-size: 1.1rem;
  }

  .bet-input-row input {
    font-family: "Mochiy Pop One", sans-serif;
    font-size: 1.3rem;
    width: 4.5rem;
    text-align: center;
    padding: 0.4rem;
    border-radius: 10px;
    border: 2px solid #ECD3C4;
  }

  .hidden { display: none; }
</style>
</head>
<body>

<div id="game-tabs"></div>
<div id="game-panel"></div>

<script>
  const themes = [
    "Animals", "Colours", "Food", "Clothes", "Body parts",
    "School things", "Family members", "Transport", "Weather",
    "Rooms in a house", "Pets", "Things in a classroom", "Emotions",
    "Personality adjectives", "Things you can find in nature",
    "Things that are blue", "Words beginning with B", "Words beginning with S",
    "Things associated with Britain", "Things associated with America"
  ];

  const games = [
    { id: "hotpotato", label: "Hot Potato", icon: "mascots/hotpotato.png" },
    { id: "gimme5", label: "Gimme 5", icon: "mascots/gimme5.png" },
    { id: "betonit", label: "Bet On It", icon: "mascots/betonit.png" }
  ];

  const tabsEl = document.getElementById("game-tabs");
  const panelEl = document.getElementById("game-panel");

  games.forEach((g, i) => {
    const btn = document.createElement("button");
    btn.className = "tab-btn";
    btn.innerHTML = '<img src="' + g.icon + '" alt="' + g.label + ' mascot"><span>' + g.label + '</span>';
    btn.onclick = () => selectGame(i);
    btn.id = "tab-" + g.id;
    tabsEl.appendChild(btn);
  });

  function pickRandomTheme() {
    return themes[Math.floor(Math.random() * themes.length)];
  }

  function setActiveTab(id) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.getElementById("tab-" + id).classList.add("active");
  }

  function selectGame(i) {
    const game = games[i];
    setActiveTab(game.id);
    if (game.id === "hotpotato") renderHotPotato();
    if (game.id === "gimme5") renderGimme5();
    if (game.id === "betonit") renderBetOnIt();
  }

  // ---- Web Audio: tick + explosion sounds (generated, no files needed) ----
  let audioCtx = null;
  function ensureAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playTick() {
    const ctx = ensureAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.value = 850;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.08);
  }

  function playExplosion() {
    const ctx = ensureAudioCtx();
    const duration = 0.6;
    const bufferSize = Math.floor(ctx.sampleRate * duration);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(1400, ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + duration);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.9, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start();
  }

  // ---- Shared fuse timer: ticks + explodes, no numbers shown ----
  let activeTimerInterval = null;

  function stopActiveTimer() {
    if (activeTimerInterval) {
      clearInterval(activeTimerInterval);
      activeTimerInterval = null;
    }
  }

  function runFuseTimer(seconds, bombId, statusId, onDone) {
    stopActiveTimer();
    const bombEl = document.getElementById(bombId);
    const statusEl = document.getElementById(statusId);
    bombEl.textContent = "💣";
    bombEl.classList.remove("exploding");
    statusEl.textContent = "Ticking...";

    let remaining = seconds;
    activeTimerInterval = setInterval(() => {
      remaining -= 1;
      playTick();
      bombEl.classList.add("pulse");
      setTimeout(() => bombEl.classList.remove("pulse"), 140);

      if (remaining <= 0) {
        stopActiveTimer();
        bombEl.textContent = "💥";
        bombEl.classList.add("exploding");
        playExplosion();
        statusEl.textContent = "Boom! Round over.";
        setTimeout(() => {
          bombEl.classList.remove("exploding");
          bombEl.textContent = "💣";
        }, 650);
        onDone();
      }
    }, 1000);
  }

  // ---- HOT POTATO ----
  function renderHotPotato() {
    stopActiveTimer();
    panelEl.innerHTML = `
      <h2 class="game-title">🥔 Hot Potato</h2>
      <p class="game-instructions">A random theme and a random timer (15&ndash;45s). Name as many words as you can before it explodes!</p>
      <div class="theme-display" id="hp-theme">Press start to begin</div>
      <div class="fuse-wrap"><span class="bomb" id="hp-bomb">💣</span></div>
      <p class="round-status" id="hp-status"></p>
      <button class="action-btn" id="hp-start">Start round</button>
    `;
    document.getElementById("hp-start").onclick = () => {
      ensureAudioCtx();
      const theme = pickRandomTheme();
      const duration = Math.floor(Math.random() * (45 - 15 + 1)) + 15;
      document.getElementById("hp-theme").textContent = theme;
      const startBtn = document.getElementById("hp-start");
      startBtn.disabled = true;
      runFuseTimer(duration, "hp-bomb", "hp-status", () => {
        startBtn.disabled = false;
        startBtn.textContent = "New round";
      });
    };
  }

  // ---- GIMME 5 ----
  function renderGimme5() {
    stopActiveTimer();
    panelEl.innerHTML = `
      <h2 class="game-title">✋ Gimme 5</h2>
      <p class="game-instructions">30 seconds to name 5 words from the theme.</p>
      <div class="theme-display" id="g5-theme">Press start to begin</div>
      <div class="fuse-wrap"><span class="bomb" id="g5-bomb">💣</span></div>
      <p class="round-status" id="g5-status"></p>
      <button class="action-btn" id="g5-start">Start round</button>
    `;
    document.getElementById("g5-start").onclick = () => {
      ensureAudioCtx();
      const theme = pickRandomTheme();
      document.getElementById("g5-theme").textContent = theme;
      const startBtn = document.getElementById("g5-start");
      startBtn.disabled = true;
      runFuseTimer(30, "g5-bomb", "g5-status", () => {
        startBtn.disabled = false;
        startBtn.textContent = "New round";
      });
    };
  }

  // ---- BET ON IT ----
  function renderBetOnIt() {
    stopActiveTimer();
    panelEl.innerHTML = `
      <h2 class="game-title">🐙 Bet On It</h2>
      <p class="game-instructions">Reveal a theme, run the bidding out loud, then type in the winning bet to start the challenge.</p>
      <div class="theme-display" id="bet-theme">Press reveal to begin</div>
      <button class="action-btn" id="bet-reveal">Reveal theme</button>
      <div id="bet-bid-section" class="hidden" style="display:flex; flex-direction:column; align-items:center; gap:0.8rem;">
        <div class="bet-input-row">
          <label for="bet-number">Winning bid:</label>
          <input type="number" id="bet-number" min="1" max="50" placeholder="?">
        </div>
        <button class="action-btn secondary" id="bet-start">Start challenge</button>
      </div>
      <div class="fuse-wrap hidden" id="bet-fuse-wrap"><span class="bomb" id="bet-bomb">💣</span></div>
      <p class="round-status" id="bet-status"></p>
      <div class="game-instructions hidden" id="bet-target"></div>
    `;

    document.getElementById("bet-reveal").onclick = (e) => {
      ensureAudioCtx();
      const theme = pickRandomTheme();
      document.getElementById("bet-theme").textContent = theme;
      document.getElementById("bet-bid-section").classList.remove("hidden");
      e.target.disabled = true;
    };

    document.getElementById("bet-start").onclick = () => {
      const betValue = parseInt(document.getElementById("bet-number").value, 10);
      if (!betValue || betValue < 1) {
        alert("Enter the winning bid first.");
        return;
      }
      document.getElementById("bet-fuse-wrap").classList.remove("hidden");
      const targetEl = document.getElementById("bet-target");
      targetEl.classList.remove("hidden");
      targetEl.textContent = "Target: " + betValue + " words in 30 seconds";
      document.getElementById("bet-start").disabled = true;

      runFuseTimer(30, "bet-bomb", "bet-status", () => {});
    };
  }

  selectGame(0);
</script>

</body>
</html>
